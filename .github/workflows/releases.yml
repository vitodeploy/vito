name: manual release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release'
        required: true
      latest:
        description: 'Mark as latest release?'
        required: true
        default: 'true'
        type: choice
        options:
          - 'true'
          - 'false'
      prerelease:
        description: 'Is this a pre-release?'
        required: true
        default: 'false'
        type: choice
        options:
          - 'true'
          - 'false'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04

    name: Release ${{ inputs.version }}

    outputs:
      version: ${{ steps.version.outputs.version }}
      notes: ${{ steps.fetch-release.outputs.notes }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_GITHUB_TOKEN }}

      - name: Remove optional "v" prefix
        id: version
        run: |
          echo "version=${VERSION#v}" >> "$GITHUB_OUTPUT"
        env:
          VERSION: ${{ inputs.version }}

      - name: Check if branch and version match
        id: guard
        run: |
          MAJOR_VERSION="${NUMERIC_VERSION%%.*}"
          BRANCH_MAJOR_VERSION="${BRANCH%%.*}"

          if [ "$MAJOR_VERSION" != "$BRANCH_MAJOR_VERSION" ]; then
            echo "Mismatched versions! Aborting."
            VERSION_MISMATCH='true';
          else
            echo "Versions match! Proceeding."
            VERSION_MISMATCH='false';
          fi

          echo "VERSION_MISMATCH=$(echo $VERSION_MISMATCH)" >> "$GITHUB_OUTPUT";
        env:
          BRANCH: ${{ github.ref_name }}
          NUMERIC_VERSION: ${{ steps.version.outputs.version }}

      - name: Fail if branch and release tag do not match
        if: ${{ steps.guard.outputs.VERSION_MISMATCH == 'true' }}
        uses: actions/github-script@v7
        with:
          script: |
            core.setFailed('Workflow failed. Release version does not match with selected target branch. Did you select the correct branch?')

      - name: Update config/app.php
        run: sed -i "s/'version' => '[^']*'/'version' => '${{ steps.version.outputs.version }}'/" config/app.php

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'

      - name: Install Composer dependencies
        run: composer install --prefer-dist --no-progress --no-suggest --no-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install NPM Dependencies
        run: npm install --force

      - name: Build assets
        run: npm run build

      # Release
      - name: Commit changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Build version ${{ steps.version.outputs.version }}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.ref_name }}
          make_latest: ${{ inputs.latest == 'true' }}
          prerelease: ${{ inputs.prerelease == 'true' }}
          generate_release_notes: true

      - name: Group release notes by prefix
        id: fetch-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          RAW_NOTES=$(gh release view "$VERSION" --json body -q .body)
          NOTES=$(printf '%s' "$RAW_NOTES" | bash .github/scripts/group-release-notes.sh)
          gh release edit "$VERSION" --notes "$NOTES"
          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Notify Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REPO: ${{ github.repository }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [[ -z "$DISCORD_WEBHOOK_URL" ]]; then
            echo "DISCORD_WEBHOOK_URL not set, skipping Discord notification"
            exit 0
          fi
          TAG="${VERSION}"
          NOTES=$(gh release view "$TAG" --repo "$REPO" --json body --jq .body \
            | sed -E 's# by @[A-Za-z0-9_-]+ in https://github\.com/[^ ]+/pull/[0-9]+##g')
          if [[ ${#NOTES} -gt 3800 ]]; then
            NOTES="${NOTES:0:3800}…"
          fi
          URL="https://github.com/${REPO}/releases/tag/${TAG}"
          if [[ "$PRERELEASE" == "true" ]]; then
            FOOTER="Pre-release channel"
            COLOR=15844367
          else
            FOOTER="Stable channel"
            COLOR=3066993
          fi
          PAYLOAD=$(jq -n \
            --arg title "VitoDeploy ${TAG} released" \
            --arg url "$URL" \
            --arg notes "$NOTES" \
            --arg footer "$FOOTER" \
            --argjson color "$COLOR" \
            '{
              username: "VitoDeploy Releases",
              embeds: [{
                title: $title,
                url: $url,
                description: $notes,
                color: $color,
                footer: { text: $footer },
                timestamp: (now | todate)
              }]
            }')
          if ! curl -fsSL -H "Content-Type: application/json" \
            -X POST -d "$PAYLOAD" "$DISCORD_WEBHOOK_URL"; then
            echo "Discord notification failed; release succeeded regardless"
          fi

  docker-tags:
    runs-on: ubuntu-24.04
    needs: release
    outputs:
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: Determine Docker tags
        id: meta
        env:
          TAG_NAME: ${{ needs.release.outputs.version }}
          COMMIT_REF: ${{ github.ref_name }}
          IS_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          echo "Tag: $TAG_NAME"
          echo "Branch: $COMMIT_REF"
          echo "Is prerelease: $IS_PRERELEASE"

          TAGS="vitodeploy/vito:$TAG_NAME"

          if [[ "$COMMIT_REF" == 1.x* ]]; then
            TAGS="$TAGS,vitodeploy/vito:1.x"
          elif [[ "$COMMIT_REF" == 2.x* ]]; then
            TAGS="$TAGS,vitodeploy/vito:2.x"
          elif [[ "$COMMIT_REF" == 3.x* ]]; then
            TAGS="$TAGS,vitodeploy/vito:3.x"
            if [[ "$IS_PRERELEASE" == "false" ]]; then
              TAGS="$TAGS,vitodeploy/vito:latest"
            fi
          elif [[ "$COMMIT_REF" == 4.x* ]]; then
            TAGS="$TAGS,vitodeploy/vito:4.x"
            if [[ "$IS_PRERELEASE" == "false" ]]; then
              TAGS="$TAGS,vitodeploy/vito:latest"
            fi
          fi

          echo "tags=$TAGS" >> "$GITHUB_OUTPUT"

  docker-build-amd64:
    runs-on: ubuntu-24.04
    needs: docker-tags
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push amd64 images
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${{ needs.docker-tags.outputs.tags }}"
          TAGS=""
          for TAG in "${TAG_ARRAY[@]}"; do
            TAGS="$TAGS --tag ${TAG}"
          done

          docker buildx build . \
            -f docker/Dockerfile \
            --platform linux/amd64 \
            --push \
            $TAGS

  docker-build-arm64:
    runs-on: ubuntu-24.04-arm
    needs: docker-tags
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build and push arm64 images
        run: |
          IFS=',' read -ra TAG_ARRAY <<< "${{ needs.docker-tags.outputs.tags }}"
          TAGS=""
          for TAG in "${TAG_ARRAY[@]}"; do
            TAGS="$TAGS --tag ${TAG}-arm64"
          done

          docker buildx build . \
            -f docker/Dockerfile \
            --platform linux/arm64 \
            --push \
            $TAGS
