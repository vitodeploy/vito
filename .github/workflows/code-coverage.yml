name: code-coverage

on:
  pull_request:
    branches:
      - 2.x
      - 3.x
      - 4.x

permissions:
  contents: read

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch base branch
        run: git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.4
          coverage: pcov

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-php-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-php-

      - name: Install dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress

      - name: Create sqlite database
        run: touch storage/database-test.sqlite

      - name: Set up the .env file
        run: touch .env

      - name: Generate Application Key
        run: php artisan key:generate

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Install NPM Dependencies
        run: npm install --force

      - name: Build assets
        run: npm run build

      - name: Assert coverage driver is active
        run: php -m | grep -qi pcov

      - name: Run tests with coverage
        run: php artisan test --coverage-clover=build/logs/clover.xml

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install diff-cover
        run: pip install "diff-cover==9.*"

      - name: Enforce 75% patch coverage
        run: |
          diff-cover build/logs/clover.xml \
            --compare-branch=origin/${{ github.base_ref }} \
            --fail-under=75 \
            --markdown-report=build/diff-cover.md

      - name: Publish coverage report to job summary
        if: always()
        run: cat build/diff-cover.md >> "$GITHUB_STEP_SUMMARY"
