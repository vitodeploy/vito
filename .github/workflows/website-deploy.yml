name: website-deploy

on:
  push:
    branches:
      - 4.x
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger website deploy
        run: |
          curl --fail --silent --show-error \
            --request POST \
            "${WEBSITE_DEPLOY_HOOK_URL}"
        env:
          WEBSITE_DEPLOY_HOOK_URL: ${{ secrets.WEBSITE_DEPLOY_HOOK_URL }}
