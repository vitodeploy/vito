name: docs-sync

on:
  push:
    branches:
      - 4.x
    paths:
      - "docs/**"

jobs:
  sync:
    runs-on: ubuntu-22.04

    steps:
      - name: Trigger docs sync
        run: |
          curl --fail --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${DOCS_SYNC_SECRET}" \
            "https://vitodeploy.com/api/docs/sync"
        env:
          DOCS_SYNC_SECRET: ${{ secrets.DOCS_SYNC_SECRET }}
