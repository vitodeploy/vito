openapi: 3.0.0
info:
  title: VitoDeploy API - Servers
  version: 1.0.0
  description: API endpoints for managing servers

servers:
  - url: http://localhost
    description: Local development server

security:
  - bearerAuth: []

paths:
  /api/projects/{project}/servers:
    get:
      summary: List servers
      description: Get all servers for a project
      tags:
        - Servers
      security:
        - bearerAuth: []
      parameters:
        - name: project
          in: path
          required: true
          description: Project ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: List of servers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
              example:
                data:
                  - id: 1
                    project_id: 1
                    services:
                      php: '8.2'
                      nginx: '1.24'
                    user_id: 1
                    provider_id: 1
                    name: 'production-server'
                    ssh_user: 'root'
                    ssh_users: ['root', 'deploy']
                    ip: '192.168.1.100'
                    local_ip: '10.0.0.100'
                    port: 22
                    os: 'ubuntu_22'
                    provider: 'digitalocean'
                    provider_data: {}
                    public_key: 'ssh-rsa AAAAB3NzaC1yc2E...'
                    status: 'ready'
                    auto_update: true
                    progress: 100
                    progress_step: 'Ready'
                    updates: {}
                    last_update_check: '2024-01-01T12:00:00.000000Z'
                    status_color: 'success'
                    features: ['ssl', 'backups', 'monitoring']
                    created_at: '2024-01-01T00:00:00.000000Z'
                    updated_at: '2024-01-01T00:00:00.000000Z'
                links:
                  first: 'http://localhost/api/projects/1/servers?page=1'
                  last: 'http://localhost/api/projects/1/servers?page=10'
                  prev: null
                  next: 'http://localhost/api/projects/1/servers?page=2'
                meta:
                  current_page: 1
                  from: 1
                  last_page: 10
                  per_page: 25
                  to: 25
                  total: 250
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create server
      description: Create a new server
      tags:
        - Servers
      security:
        - bearerAuth: []
      parameters:
        - name: project
          in: path
          required: true
          description: Project ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - provider
                - name
                - os
              properties:
                provider:
                  type: string
                  enum: ['custom', 'aws', 'hetzner', 'digitalocean', 'linode', 'vultr']
                  description: Server provider type
                  example: 'digitalocean'
                name:
                  type: string
                  description: Server name
                  example: 'production-server'
                os:
                  type: string
                  enum: ['ubuntu_20', 'ubuntu_22', 'ubuntu_24']
                  description: Operating system
                  example: 'ubuntu_22'
                server_provider:
                  type: integer
                  description: Server provider ID (required for non-custom providers)
                  example: 1
                ip:
                  type: string
                  description: Server IP address (required for custom provider)
                  example: '192.168.1.100'
                port:
                  type: integer
                  minimum: 1
                  maximum: 65535
                  description: SSH port (required for custom provider)
                  example: 22
                services:
                  type: array
                  description: Services to install on the server
                  items:
                    type: object
                    required:
                      - type
                      - name
                      - version
                    properties:
                      type:
                        type: string
                        description: Service type
                        example: 'php'
                      name:
                        type: string
                        description: Service name
                        example: 'php'
                      version:
                        type: string
                        description: Service version
                        example: '8.2'
                  example:
                    - type: 'php'
                      name: 'php'
                      version: '8.2'
                    - type: 'webserver'
                      name: 'nginx'
                      version: '1.24'
            example:
              provider: 'digitalocean'
              name: 'production-server'
              os: 'ubuntu_22'
              server_provider: 1
              services:
                - type: 'php'
                  name: 'php'
                  version: '8.2'
                - type: 'webserver'
                  name: 'nginx'
                  version: '1.24'
      responses:
        '201':
          description: Server created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
              example:
                id: 1
                project_id: 1
                services:
                  php: '8.2'
                  nginx: '1.24'
                user_id: 1
                provider_id: 1
                name: 'production-server'
                ssh_user: 'root'
                ssh_users: ['root', 'deploy']
                ip: '192.168.1.100'
                local_ip: '10.0.0.100'
                port: 22
                os: 'ubuntu_22'
                provider: 'digitalocean'
                provider_data: {}
                public_key: 'ssh-rsa AAAAB3NzaC1yc2E...'
                status: 'installing'
                auto_update: true
                progress: 0
                progress_step: 'Initializing'
                updates: {}
                last_update_check: null
                status_color: 'warning'
                features: []
                created_at: '2024-01-01T00:00:00.000000Z'
                updated_at: '2024-01-01T00:00:00.000000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: 'The given data was invalid.'
                errors:
                  provider: ['The provider field is required.']
                  name: ['The name field is required.']
                  os: ['The os field is required.']

  /api/projects/{project}/servers/{server}:
    get:
      summary: Get server
      description: Get a specific server by ID
      tags:
        - Servers
      security:
        - bearerAuth: []
      parameters:
        - name: project
          in: path
          required: true
          description: Project ID
          schema:
            type: integer
            example: 1
        - name: server
          in: path
          required: true
          description: Server ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Server details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Server'
              example:
                id: 1
                project_id: 1
                services:
                  php: '8.2'
                  nginx: '1.24'
                user_id: 1
                provider_id: 1
                name: 'production-server'
                ssh_user: 'root'
                ssh_users: ['root', 'deploy']
                ip: '192.168.1.100'
                local_ip: '10.0.0.100'
                port: 22
                os: 'ubuntu_22'
                provider: 'digitalocean'
                provider_data: {}
                public_key: 'ssh-rsa AAAAB3NzaC1yc2E...'
                status: 'ready'
                auto_update: true
                progress: 100
                progress_step: 'Ready'
                updates: {}
                last_update_check: '2024-01-01T12:00:00.000000Z'
                status_color: 'success'
                features: ['ssl', 'backups', 'monitoring']
                created_at: '2024-01-01T00:00:00.000000Z'
                updated_at: '2024-01-01T00:00:00.000000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      summary: Delete server
      description: Delete a server
      tags:
        - Servers
      security:
        - bearerAuth: []
      parameters:
        - name: project
          in: path
          required: true
          description: Project ID
          schema:
            type: integer
            example: 1
        - name: server
          in: path
          required: true
          description: Server ID
          schema:
            type: integer
            example: 1
      responses:
        '204':
          description: Server deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project}/servers/{server}/reboot:
    post:
      summary: Reboot server
      description: Reboot a server
      tags:
        - Servers
      security:
        - bearerAuth: []
      parameters:
        - name: project
          in: path
          required: true
          description: Project ID
          schema:
            type: integer
            example: 1
        - name: server
          in: path
          required: true
          description: Server ID
          schema:
            type: integer
            example: 1
      responses:
        '204':
          description: Server reboot initiated successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/projects/{project}/servers/{server}/upgrade:
    post:
      summary: Upgrade server
      description: Upgrade a server's packages and services
      tags:
        - Servers
      security:
        - bearerAuth: []
      parameters:
        - name: project
          in: path
          required: true
          description: Project ID
          schema:
            type: integer
            example: 1
        - name: server
          in: path
          required: true
          description: Server ID
          schema:
            type: integer
            example: 1
      responses:
        '204':
          description: Server upgrade initiated successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Server not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sanctum bearer token authentication
  
  schemas:
    Server:
      type: object
      properties:
        id:
          type: integer
          example: 1
        project_id:
          type: integer
          example: 1
        services:
          type: object
          additionalProperties:
            type: string
          example:
            php: '8.2'
            nginx: '1.24'
        user_id:
          type: integer
          example: 1
        provider_id:
          type: integer
          nullable: true
          example: 1
        name:
          type: string
          example: 'production-server'
        ssh_user:
          type: string
          example: 'root'
        ssh_users:
          type: array
          items:
            type: string
          example: ['root', 'deploy']
        ip:
          type: string
          example: '192.168.1.100'
        local_ip:
          type: string
          nullable: true
          example: '10.0.0.100'
        port:
          type: integer
          example: 22
        os:
          type: string
          example: 'ubuntu-22.04'
        provider:
          type: string
          example: 'digitalocean'
        provider_data:
          type: object
          nullable: true
        public_key:
          type: string
          nullable: true
        status:
          type: string
          enum: ['ready', 'installing', 'installation_failed', 'disconnected', 'updating']
          example: 'ready'
        auto_update:
          type: boolean
          example: true
        progress:
          type: integer
          minimum: 0
          maximum: 100
          example: 100
        progress_step:
          type: string
          example: 'Installing services'
        updates:
          type: object
          nullable: true
        last_update_check:
          type: string
          format: date-time
          nullable: true
        status_color:
          type: string
          enum: ['success', 'warning', 'danger', 'gray']
          example: 'success'
        features:
          type: array
          items:
            type: string
          example: ['ssl', 'backups', 'monitoring']
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        links:
          type: object
          properties:
            first:
              type: string
              example: 'http://localhost/api/projects?page=1'
            last:
              type: string
              example: 'http://localhost/api/projects?page=10'
            prev:
              type: string
              nullable: true
              example: null
            next:
              type: string
              nullable: true
              example: 'http://localhost/api/projects?page=2'
        meta:
          type: object
          properties:
            current_page:
              type: integer
              example: 1
            from:
              type: integer
              example: 1
            last_page:
              type: integer
              example: 10
            per_page:
              type: integer
              example: 25
            to:
              type: integer
              example: 25
            total:
              type: integer
              example: 250
    
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Error message'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            field: ['Error message for field']
    
    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: 'The given data was invalid.'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            field: ['The field is required.']
