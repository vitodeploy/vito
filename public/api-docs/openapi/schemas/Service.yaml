type: object
properties:
  id:
    type: integer
    example: 1
  server_id:
    type: integer
    example: 1
  type:
    type: string
    example: 'php'
  type_data:
    type: object
    nullable: true
  config_paths:
    type: array
    items:
      type: string
    example: ['/etc/php/8.2/fpm/php.ini']
  name:
    type: string
    example: 'php'
  version:
    type: string
    example: '8.2'
  installed_version:
    type: string
    nullable: true
    example: '8.2.0'
  unit:
    type: string
    nullable: true
    example: 'php8.2-fpm'
  status:
    type: string
    enum:
      [
        'ready',
        'installing',
        'installation_failed',
        'uninstalling',
        'failed',
        'starting',
        'stopping',
        'restarting',
        'reloading',
        'stopped',
        'enabling',
        'disabling',
        'disabled',
      ]
    example: 'ready'
  status_color:
    type: string
    enum: ['success', 'warning', 'danger', 'gray']
    example: 'success'
  icon:
    type: string
    example: 'fab fa-php'
  is_default:
    type: boolean
    example: true
  log:
    type: object
    nullable: true
    description: The latest server log associated with this service, if any
    properties:
      id:
        type: integer
        example: 1
      server_id:
        type: integer
        example: 1
      site_id:
        type: integer
        nullable: true
        example: null
      type:
        type: string
        example: 'service'
      name:
        type: string
        example: 'install-php-8.2'
      disk:
        type: string
        example: 'local'
      is_remote:
        type: boolean
        example: false
      created_at:
        type: string
        format: date-time
      updated_at:
        type: string
        format: date-time
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
