type: object
properties:
  id:
    type: integer
    example: 1
  name:
    type: string
    example: 'My SSH Key'
  deployment_user:
    type: string
    nullable: true
    description: Server user the key is deployed to
    example: 'vito'
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
