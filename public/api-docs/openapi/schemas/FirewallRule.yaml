type: object
properties:
  id:
    type: integer
    example: 1
  name:
    type: string
    example: 'SSH Access'
  server_id:
    type: integer
    example: 1
  type:
    type: string
    example: 'allow'
  protocol:
    type: string
    example: 'tcp'
  port:
    type: string
    description: A single port (e.g. "22") or an inclusive port range (e.g. "3000:3010"). Each side must be between 1 and 65535, and the start must be lower than the end (the start-less-than-end constraint is enforced by the server and not expressible in this pattern).
    pattern: '^(6553[0-5]|655[0-2]\d|65[0-4]\d{2}|6[0-4]\d{3}|[1-5]\d{4}|[1-9]\d{0,3})(:(6553[0-5]|655[0-2]\d|65[0-4]\d{2}|6[0-4]\d{3}|[1-5]\d{4}|[1-9]\d{0,3}))?$'
    example: '22'
  source:
    type: string
    example: '0.0.0.0/0'
  mask:
    type: string
    nullable: true
    description: 'CIDR prefix length (1-32) for the source IP, or null when the source is unrestricted.'
    example: '32'
  note:
    type: string
    nullable: true
    example: 'Allow SSH access from anywhere'
  status:
    type: string
    enum: ['creating', 'updating', 'ready', 'deleting', 'failed']
    example: 'ready'
  status_color:
    type: string
    enum: ['info', 'warning', 'danger', 'success']
    example: 'success'
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
