components:
  schemas:
    PaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items: {}
        links:
          type: object
          properties:
            first:
              type: string
              example: 'http://localhost/api/projects?page=1'
            last:
              type: string
              example: 'http://localhost/api/projects?page=10'
            prev:
              type: string
              nullable: true
              example: null
            next:
              type: string
              nullable: true
              example: 'http://localhost/api/projects?page=2'
        meta:
          type: object
          properties:
            current_page:
              type: integer
              example: 1
            from:
              type: integer
              example: 1
            last_page:
              type: integer
              example: 10
            per_page:
              type: integer
              example: 25
            to:
              type: integer
              example: 25
            total:
              type: integer
              example: 250
