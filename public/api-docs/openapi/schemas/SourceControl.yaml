type: object
properties:
  id:
    type: integer
    example: 1
  project_id:
    type: integer
    nullable: true
    example: 1
  user_id:
    type: integer
    example: 1
  global:
    type: boolean
    example: false
    description: 'True if the source control is available globally (not project-specific)'
  name:
    type: string
    example: 'GitHub'
  provider:
    type: string
    example: 'github'
  external_identifier:
    type: string
    nullable: true
    description: 'Provider-specific external identifier (e.g. GitHub App installation ID).'
    example: '12345678'
  github_app:
    type: object
    nullable: true
    description: 'Present only when provider is "github-app". Contains metadata about the GitHub App installation.'
    properties:
      account_login:
        type: string
        nullable: true
        example: 'acme-org'
      account_type:
        type: string
        nullable: true
        description: 'GitHub account type, e.g. "User" or "Organization".'
        example: 'Organization'
      html_url:
        type: string
        nullable: true
        format: uri
        example: 'https://github.com/organizations/acme-org/settings/installations/12345678'
  ssh_port:
    type: integer
    nullable: true
    minimum: 1
    maximum: 65535
    example: 22
    description: 'SSH port used when cloning repositories. Only present for providers that support a custom port (Gitea, GitLab).'
  created_at:
    type: string
    format: date-time
  updated_at:
    type: string
    format: date-time
