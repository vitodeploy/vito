paths:
  /api/server-providers:
    get:
      summary: List user's server providers
      description: Get all server providers for the authenticated user
      tags:
        - User Server Providers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of server providers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '/api-docs/openapi/schemas/PaginatedResponse.yaml'
                  - type: object
                    properties:
                      data:
                        type: array
                        items:
                          $ref: '/api-docs/openapi/schemas/ServerProvider.yaml'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'

    post:
      summary: Create server provider
      description: Create a new server provider for the authenticated user
      tags:
        - User Server Providers
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - provider
              oneOf:
                - properties:
                    provider:
                      enum: ['aws', 'lightsail']
                  required: ['key', 'secret']
                - properties:
                    provider:
                      enum: ['hetzner', 'digitalocean', 'linode', 'vultr']
                  required: ['token']
                - properties:
                    provider:
                      enum: ['proxmox']
                  required: ['api_url', 'token_id', 'token_secret']
                  anyOf:
                    - required: ['template_ubuntu_20']
                    - required: ['template_ubuntu_22']
                    - required: ['template_ubuntu_24']
                    - required: ['template_ubuntu_26']
              properties:
                name:
                  type: string
                  description: Server provider name
                  example: 'DigitalOcean'
                provider:
                  type: string
                  enum: ['aws', 'lightsail', 'hetzner', 'digitalocean', 'linode', 'vultr', 'proxmox']
                  description: Server provider type
                  example: 'digitalocean'
                token:
                  type: string
                  writeOnly: true
                  description: API token (required for Hetzner, DigitalOcean, Linode, and Vultr)
                key:
                  type: string
                  writeOnly: true
                  description: Access key ID (required for AWS and AWS Lightsail)
                secret:
                  type: string
                  writeOnly: true
                  description: Secret access key (required for AWS and AWS Lightsail)
                api_url:
                  type: string
                  format: uri
                  description: Proxmox HTTPS API URL
                token_id:
                  type: string
                  description: 'Proxmox API token ID (`user@realm!name`)'
                token_secret:
                  type: string
                  writeOnly: true
                  description: Proxmox API token secret
                verify_ssl:
                  type: boolean
                  default: true
                storage:
                  type: string
                  description: Optional Proxmox disk storage
                template_ubuntu_20:
                  type: integer
                  minimum: 100
                  description: Proxmox Ubuntu 20.04 cloud-init template VMID (at least one template is required)
                template_ubuntu_22:
                  type: integer
                  minimum: 100
                  description: Proxmox Ubuntu 22.04 cloud-init template VMID (at least one template is required)
                template_ubuntu_24:
                  type: integer
                  minimum: 100
                  description: Proxmox Ubuntu 24.04 cloud-init template VMID (at least one template is required)
                template_ubuntu_26:
                  type: integer
                  minimum: 100
                  description: Proxmox Ubuntu 26.04 cloud-init template VMID (at least one template is required)
                global:
                  type: boolean
                  description: Whether this provider should be available globally (not tied to current project)
                  example: false
      responses:
        '200':
          description: Server provider created successfully
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ServerProvider.yaml'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ValidationError.yaml'

  /api/server-providers/{serverProvider}:
    get:
      summary: Get server provider
      description: Get a specific server provider by ID
      tags:
        - User Server Providers
      security:
        - bearerAuth: []
      parameters:
        - name: serverProvider
          in: path
          required: true
          description: Server provider ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Server provider details
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ServerProvider.yaml'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'
        '404':
          description: Server provider not found
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'

    put:
      summary: Update server provider
      description: 'Update a server provider. Proxmox connections also accept `template_ubuntu_20`, `template_ubuntu_22`, `template_ubuntu_24` and `template_ubuntu_26` (cloud-init template VM IDs); omitted fields keep their current value, and when a template changes all mapped templates are re-verified against Proxmox before saving. Other credentials, including the API token, can''t be changed.'
      tags:
        - User Server Providers
      security:
        - bearerAuth: []
      parameters:
        - name: serverProvider
          in: path
          required: true
          description: Server provider ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: Server provider name
                  example: 'DigitalOcean'
                global:
                  type: boolean
                  description: Whether this provider should be available globally (not tied to current project)
                  example: false
              additionalProperties: true
            example:
              name: 'Proxmox'
              global: false
              template_ubuntu_26: 9026
      responses:
        '200':
          description: Server provider updated successfully
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ServerProvider.yaml'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'
        '404':
          description: Server provider not found
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ValidationError.yaml'

    delete:
      summary: Delete server provider
      description: Delete a server provider
      tags:
        - User Server Providers
      security:
        - bearerAuth: []
      parameters:
        - name: serverProvider
          in: path
          required: true
          description: Server provider ID
          schema:
            type: integer
            example: 1
      responses:
        '204':
          description: Server provider deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'
        '404':
          description: Server provider not found
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'

  /api/server-providers/{serverProvider}/regions:
    get:
      summary: Get server provider regions
      description: Get available regions for a server provider
      tags:
        - User Server Providers
      security:
        - bearerAuth: []
      parameters:
        - name: serverProvider
          in: path
          required: true
          description: Server provider ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: List of available regions
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Region identifier
                      example: 'nyc1'
                    name:
                      type: string
                      description: Region name
                      example: 'New York 1'
                    country:
                      type: string
                      description: Country code
                      example: 'US'
                    available:
                      type: boolean
                      description: Whether the region is available
                      example: true
              example:
                - id: 'nyc1'
                  name: 'New York 1'
                  country: 'US'
                  available: true
                - id: 'sfo1'
                  name: 'San Francisco 1'
                  country: 'US'
                  available: true
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'
        '404':
          description: Server provider not found
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'

  /api/server-providers/{serverProvider}/regions/{region}/plans:
    get:
      summary: Get server provider plans
      description: Get available plans for a server provider in a specific region
      tags:
        - User Server Providers
      security:
        - bearerAuth: []
      parameters:
        - name: serverProvider
          in: path
          required: true
          description: Server provider ID
          schema:
            type: integer
            example: 1
        - name: region
          in: path
          required: true
          description: Region identifier
          schema:
            type: string
            example: 'nyc1'
      responses:
        '200':
          description: Map of available plans keyed by plan identifier
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                  description: Human-readable plan label
              example:
                s-1vcpu-1gb: 'Basic - 1 Cores - 1024 Memory - 25 Disk (5.00/mo)'
                s-1vcpu-2gb: 'Standard - 1 Cores - 2048 Memory - 50 Disk (10.00/mo)'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'
        '404':
          description: Server provider or region not found
          content:
            application/json:
              schema:
                $ref: '/api-docs/openapi/schemas/ErrorResponse.yaml'
