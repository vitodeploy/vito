openapi: 3.0.0
info:
  title: VitoDeploy API - Projects
  version: 1.0.0
  description: API endpoints for managing projects

servers:
  - url: http://localhost
    description: Local development server

security:
  - bearerAuth: []

paths:
  /api/projects:
    get:
      summary: List projects
      description: Get all projects for the authenticated user
      tags:
        - Projects
      security:
        - bearerAuth: []
      responses:
        '200':
          description: List of projects
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
              example:
                - id: 1
                  name: 'my-project'
                  role: 'owner'
                  created_at: '2024-01-01T00:00:00.000000Z'
                  updated_at: '2024-01-01T00:00:00.000000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      summary: Create project
      description: Create a new project
      tags:
        - Projects
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 255
                  pattern: '^[a-z0-9_-]+$'
                  description: Project name (lowercase, alphanumeric, hyphens, underscores only)
                  example: 'my-project'
            example:
              name: 'my-new-project'
      responses:
        '201':
          description: Project created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example:
                id: 1
                name: 'my-new-project'
                role: 'owner'
                created_at: '2024-01-01T00:00:00.000000Z'
                updated_at: '2024-01-01T00:00:00.000000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: 'The given data was invalid.'
                errors:
                  name: ['The name field is required.']

  /api/projects/{project}:
    get:
      summary: Get project
      description: Get a specific project by ID
      tags:
        - Projects
      security:
        - bearerAuth: []
      parameters:
        - name: project
          in: path
          required: true
          description: Project ID
          schema:
            type: integer
            example: 1
      responses:
        '200':
          description: Project details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example:
                id: 1
                name: 'my-project'
                role: 'owner'
                created_at: '2024-01-01T00:00:00.000000Z'
                updated_at: '2024-01-01T00:00:00.000000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      summary: Update project
      description: Update a project's details
      tags:
        - Projects
      security:
        - bearerAuth: []
      parameters:
        - name: project
          in: path
          required: true
          description: Project ID
          schema:
            type: integer
            example: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  maxLength: 255
                  pattern: '^[a-z0-9_-]+$'
                  description: Project name (lowercase, alphanumeric, hyphens, underscores only)
                  example: 'updated-project-name'
            example:
              name: 'updated-project-name'
      responses:
        '200':
          description: Project updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
              example:
                id: 1
                name: 'updated-project-name'
                role: 'owner'
                created_at: '2024-01-01T00:00:00.000000Z'
                updated_at: '2024-01-01T12:00:00.000000Z'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: 'The given data was invalid.'
                errors:
                  name: ['The name field is required.']

    delete:
      summary: Delete project
      description: Delete a project (cannot delete last project or current project)
      tags:
        - Projects
      security:
        - bearerAuth: []
      parameters:
        - name: project
          in: path
          required: true
          description: Project ID
          schema:
            type: integer
            example: 1
      responses:
        '204':
          description: Project deleted successfully
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Project not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
              example:
                message: 'The given data was invalid.'
                errors:
                  name: ['Cannot delete the last project.']

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sanctum bearer token authentication
  
  schemas:
    Project:
      type: object
      properties:
        id:
          type: integer
          example: 1
        name:
          type: string
          example: 'my-project'
        role:
          type: string
          enum: ['owner', 'admin', 'developer', 'viewer']
          nullable: true
          example: 'owner'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        users:
          type: array
          items:
            $ref: '#/components/schemas/ProjectUser'
          nullable: true
    
    ProjectUser:
      type: object
      properties:
        id:
          type: integer
          example: 1
        user_id:
          type: integer
          example: 1
        project_id:
          type: integer
          example: 1
        role:
          type: string
          enum: ['owner', 'admin', 'developer', 'viewer']
          example: 'developer'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: 'Error message'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            field: ['Error message for field']
    
    ValidationError:
      type: object
      properties:
        message:
          type: string
          example: 'The given data was invalid.'
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
          example:
            field: ['The field is required.']
