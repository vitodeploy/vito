appId: com.vitodeploy.vito
productName: Vito
artifactName: Vito-${version}-${os}-${arch}.${ext}
directories:
  output: release
files:
  - dist/**/*
  - package.json
extraResources:
  - from: ../desktop-build/app
    to: app
    filter:
      - "**/*"
  - from: resources/bin
    to: bin
    filter:
      - "**/*"
mac:
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: entitlements.mac.plist
  entitlementsInherit: entitlements.mac.plist
  binaries:
    - "Resources/bin/darwin/${arch}/php"
  target:
    - dmg
    - zip
dmg:
  sign: false
win:
  target:
    - nsis
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Development
  maintainer: VitoDeploy
  target:
    - AppImage
publish: null
npmRebuild: false
